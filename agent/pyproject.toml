[project]
name = "debugforge-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-bedrock-token-generator>=1.1.0",
    "bedrock-agentcore>=0.1.3",
    "bedrock-agentcore-starter-toolkit>=0.1.10",
    "dotenv>=0.9.9",
    "mcp>=2.1.1",
    "openai>=2.54.0",
    "pydantic>=2.11.9",
    "strands-agents[openai]>=1.8.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]
